name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ studio-auth-deeplink ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"

      # The repo lists two git submodules (OpenXR-SDK, sdl2) but the sdl2 entry has no URL,
      # so a normal submodule checkout fails. Fetch both sources by hand.
      - name: Fetch native dependencies
        run: |
          CPP=app/src/main/cpp

          rm -rf "$CPP/sdl2"
          git clone --depth 1 --branch release-2.30.8 https://github.com/libsdl-org/SDL.git "$CPP/sdl2"
          # evshim.c includes <SDL2/SDL.h>; make that path resolve inside the SDL source tree
          ln -s . "$CPP/sdl2/include/SDL2"

          rm -rf "$CPP/OpenXR-SDK"
          mkdir "$CPP/OpenXR-SDK"
          git -C "$CPP/OpenXR-SDK" init -q
          git -C "$CPP/OpenXR-SDK" remote add origin https://github.com/KhronosGroup/OpenXR-SDK.git
          git -C "$CPP/OpenXR-SDK" fetch -q --depth 1 origin 977f6675bc0057d5a54ed290cb5c71c699b1c0ab
          git -C "$CPP/OpenXR-SDK" checkout -q FETCH_HEAD

          ls "$CPP/sdl2/CMakeLists.txt" "$CPP/OpenXR-SDK/CMakeLists.txt"

      # The repo does not contain the large runtime files (imagefs.txz = Linux rootfs, the Wine
      # builds, container patterns). Without them the app cannot create a container ("+" does nothing).
      # Take them from the official release APK, without overwriting anything already in the repo.
      - name: Add runtime files from the official release APK
        run: |
          curl -fL --retry 3 -o /tmp/official.apk \
            https://github.com/coffincolors/winlator/releases/download/cmod_v13.1/Winlator-Cmod-v13.1.1.apk
          mkdir /tmp/official
          unzip -q /tmp/official.apk 'assets/*' -d /tmp/official
          cp -rn /tmp/official/assets/. app/src/main/assets/
          ls -la app/src/main/assets | grep -E "imagefs|proton|container_pattern"
          test -f app/src/main/assets/imagefs.txz

      # The Mali-G72 wrapper advertises VK_EXT_transform_feedback but vkCreateDevice rejects it (-8), which stock DXVK 1.10.3
      # needs for D3D11 feature level 10_0. Build a d3d11.dll without that requirement and pack it as its own DXVK version.
      - name: Build patched DXVK d3d11.dll
        timeout-minutes: 15
        run: |
          timeout 300 sudo apt-get install -y -qq gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix glslang-tools meson ninja-build zstd
          tools/dxvk/build_d3d11.sh /tmp/dxvk-work /tmp/dxvk-out/d3d11.dll
          mkdir /tmp/dxvk-pack
          tar -I zstd -xf app/src/main/assets/dxwrapper/dxvk-1.10.3.tzst -C /tmp/dxvk-pack
          cp /tmp/dxvk-out/d3d11.dll /tmp/dxvk-pack/system32/d3d11.dll
          # The archive must be named after the version the app asks for (StudioPreset.DXVK_VERSION).
          VER=$(grep -oP 'DXVK_VERSION = "\K[^"]+' app/src/main/java/com/winlator/cmod/StudioPreset.java)
          echo "DXVK version: $VER"
          tar -I zstd -cf "app/src/main/assets/dxwrapper/dxvk-$VER.tzst" -C /tmp/dxvk-pack .
          tar -I zstd -tvf "app/src/main/assets/dxwrapper/dxvk-$VER.tzst"

      - name: Build GPU probe (Windows exe run inside Wine)
        run: |
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc -O2 -mconsole -include stdarg.h -o app/src/main/assets/gpuprobe.exe tools/gpuprobe/gpuprobe.c
          ls -la app/src/main/assets/gpuprobe.exe

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ctblox-studio-apk
          path: app/build/outputs/apk/debug/*.apk
